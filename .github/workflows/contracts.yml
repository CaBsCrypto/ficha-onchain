name: contracts

# Green CI proving the Soroban contract test suite passes, plus a deployable
# WASM as a downloadable artifact.
#
# Local and CI builds use Stellar CLI with wasm32v1-none. No deployment.

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  # Lets a WASM be built on demand from any branch, without a contract change.
  workflow_dispatch:

jobs:
  deployed-wasm:
    name: reproduce deployed clinical WASM
    runs-on: windows-latest
    defaults:
      run:
        working-directory: contracts
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: wasm32v1-none
      - name: Install pinned Stellar CLI
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'stellar-cli.tar.gz'
          Invoke-WebRequest 'https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-pc-windows-msvc.tar.gz' -OutFile $archive
          tar -xzf $archive -C $env:RUNNER_TEMP
          $env:RUNNER_TEMP | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and compare to Testnet manifest
        run: |
          stellar --version
          stellar contract build --locked --package clinical-history-private --out-dir dist-deployed
          if ($LASTEXITCODE -ne 0) { throw 'Clinical build failed' }
          $manifest = Get-Content ../docs/evidence/sow2-week1-2026-10-05/deployment.json -Raw | ConvertFrom-Json
          $artifact = Get-Item dist-deployed/clinical_history_private.wasm
          $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $manifest.wasmHash -or $artifact.Length -ne $manifest.wasmBytes) { throw 'WASM does not match deployed Testnet evidence' }
          Write-Output "Verified deployed WASM: $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: deployed-clinical-wasm
          path: contracts/dist-deployed/
          retention-days: 30
          if-no-files-found: error

  test:
    name: cargo test (Soroban contracts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      # Private prescription tests exercise the real private registry too.
      - name: Run test suite
        run: cargo test --locked --workspace --verbose

  build:
    name: build WASM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: wasm32v1-none

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
          # The optimize step below reads target/, and a restored one already
          # served a stale artifact once — a build whose flags had changed came
          # back byte-identical. Keyed per job so that cannot repeat.
          key: wasm

      # Prebuilt binary, not `cargo install`: this step runs inside contracts/,
      # so cargo would resolve against the workspace's lockfile and fail. Also
      # saves several minutes of compiling the CLI from source.
      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz             | tar xz -C /tmp
          sudo mv /tmp/stellar /usr/local/bin/
          stellar --version

      - name: Build contracts with Stellar CLI
        run: |
          for p in doctor-registry-private prescription-private clinical-history-private; do
            stellar contract build --locked --package "$p" --out-dir dist
          done
          sha256sum dist/*.wasm > dist/SHA256SUMS

      - name: Upload WASM
        uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm
          path: contracts/dist/
          retention-days: 30
          if-no-files-found: error
