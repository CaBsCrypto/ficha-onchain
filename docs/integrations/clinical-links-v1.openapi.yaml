openapi: 3.1.0
info:
  title: TrustLeaf Clinical Links
  version: 1.0.0
  description: API privada de prueba con identidades y documentos sintéticos.
servers:
  - url: /api/v1
paths:
  /bindings/claim:
    post:
      summary: Canjea el código de una vinculación iniciada por el paciente.
      security: [{ partner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, actorRef]
              properties:
                code: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
                actorRef: { $ref: '#/components/schemas/Commitment' }
      responses:
        '200':
          description: Código que el paciente confirma en FichaOnChain.
          content:
            application/json:
              schema:
                type: object
                required: [bindingId, confirmationCode]
                properties:
                  bindingId: { type: string, format: uuid }
                  confirmationCode: { type: string, pattern: '^[0-9]{8}$' }
        default: { $ref: '#/components/responses/Error' }
  /bindings/status:
    post:
      summary: Consulta el estado de la vinculación del mismo actor de Cannabis.
      security: [{ partner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bindingId, actorRef]
              properties:
                bindingId: { type: string, format: uuid }
                actorRef: { $ref: '#/components/schemas/Commitment' }
      responses:
        '200':
          description: La referencia del paciente se entrega con una vinculación activa.
          content:
            application/json:
              schema:
                type: object
                required: [status, expiresAt]
                properties:
                  status: { enum: [pending, claimed, active, revoked, expired] }
                  partnerPatientRef: { type: string, format: uuid }
                  expiresAt: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }
  /clinical-link-events:
    post:
      summary: Registra una emisión o revocación con permiso vigente.
      security: [{ partner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Event' }
      responses:
        '202': { $ref: '#/components/responses/Receipt' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /clinical-link-events/{eventId}:
    get:
      summary: Consulta el recibo del evento propio del socio.
      security: [{ partner: [] }]
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Receipt' }
        default: { $ref: '#/components/responses/Error' }
  /me/clinical-links:
    get:
      summary: Lista las recetas vinculadas visibles para el paciente autenticado.
      security: [{ patient: [] }]
      responses:
        '200':
          description: Referencias privadas y navegación autenticada al portal emisor.
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links:
                    type: array
                    items: { $ref: '#/components/schemas/Link' }
        default: { $ref: '#/components/responses/Error' }
  /clinical-links/{linkRef}/proof:
    get:
      summary: Comprueba en Testnet el compromiso de la revisión del documento.
      security: [{ patient: [] }, { partner: [] }]
      parameters:
        - { name: linkRef, in: path, required: true, schema: { type: string, format: uuid } }
        - name: revision
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Revision' }
      responses:
        '200':
          description: El visor comprueba los bytes del PDF con el compromiso verificado.
          content:
            application/json:
              schema:
                type: object
                required: [linkRef, revision, integrityStatus, commitment]
                properties:
                  linkRef: { type: string, format: uuid }
                  revision: { $ref: '#/components/schemas/Revision' }
                  integrityStatus: { enum: [pending, verified, unavailable] }
                  commitment:
                    oneOf: [{ $ref: '#/components/schemas/Commitment' }, { type: 'null' }]
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    partner:
      type: http
      scheme: bearer
      description: Credencial de servidor sandbox con alcance para la operación solicitada.
    patient:
      type: http
      scheme: bearer
      description: Token Privy del paciente emitido para FichaOnChain.
  responses:
    Error:
      description: Error de validación, autorización, conflicto o disponibilidad.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
    Receipt:
      description: Recibo persistido. Un reenvío idéntico conserva su resultado inicial.
      content:
        application/json:
          schema:
            type: object
            required: [eventId, linkRef, revision, result, receivedAt]
            properties:
              eventId: { type: string, format: uuid }
              linkRef: { type: string, format: uuid }
              revision: { $ref: '#/components/schemas/Revision' }
              result: { enum: [applied, stale] }
              receivedAt: { type: string, format: date-time }
  schemas:
    Revision: { type: integer, minimum: 1, maximum: 2147483647 }
    Commitment: { type: string, pattern: '^[0-9a-f]{64}$' }
    Event:
      type: object
      additionalProperties: false
      required: [schemaVersion, eventId, eventType, partnerPatientRef, resourceRef, category, clinicalStatus, revision, occurredAt, documentRevision]
      properties:
        schemaVersion: { const: 1 }
        eventId: { type: string, format: uuid }
        eventType: { enum: [clinical-link.issued, clinical-link.revoked] }
        partnerPatientRef: { type: string, format: uuid }
        resourceRef: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        category: { const: cannabis.prescription }
        clinicalStatus: { enum: [active, revoked] }
        revision: { $ref: '#/components/schemas/Revision' }
        documentRevision: { $ref: '#/components/schemas/Revision' }
        occurredAt: { type: string, format: date-time, description: Fecha UTC con sufijo Z. }
        commitment: { $ref: '#/components/schemas/Commitment' }
      oneOf:
        - properties:
            eventType: { const: clinical-link.issued }
            clinicalStatus: { const: active }
          required: [commitment]
          description: La revisión del documento es igual a la revisión del evento.
        - properties:
            eventType: { const: clinical-link.revoked }
            clinicalStatus: { const: revoked }
          not: { required: [commitment] }
          description: La revisión del documento es anterior a la revisión del evento.
    Link:
      type: object
      required: [linkRef, category, source, clinicalStatus, revision, documentRevision, occurredAt, proofState, href]
      properties:
        linkRef: { type: string, format: uuid }
        category: { const: cannabis.prescription }
        source: { type: string }
        clinicalStatus: { enum: [active, revoked] }
        revision: { $ref: '#/components/schemas/Revision' }
        documentRevision: { $ref: '#/components/schemas/Revision' }
        occurredAt: { type: string, format: date-time }
        proofState: { enum: [pending, confirmed, unavailable] }
        href: { type: string, format: uri }
